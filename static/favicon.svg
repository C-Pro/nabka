<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect width="60" height="60" x="2" y="2" rx="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Rising sun over Amur Bay -->
  <circle cx="32" cy="27" r="13" fill="url(#sun)" />

  <!-- Back wave / Sopka silhouette -->
  <path d="M 6 42 Q 18 34 32 38 T 58 40 L 58 56 Q 58 58 56 58 L 8 58 Q 6 58 6 56 Z" fill="url(#wave2)" opacity="0.85" />

  <!-- Front crest wave -->
  <path d="M 6 47 Q 20 40 33 46 T 58 45 L 58 56 Q 58 58 56 58 L 8 58 Q 6 58 6 56 Z" fill="url(#wave1)" />

  <!-- Wave spray / foam accents -->
  <circle cx="21" cy="38" r="1.5" fill="#ffffff" opacity="0.9" />
  <circle cx="46" cy="42" r="1.2" fill="#ffffff" opacity="0.9" />
  <circle cx="34" cy="43" r="1.0" fill="#ffffff" opacity="0.8" />
</svg>
